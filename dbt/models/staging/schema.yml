version: 2

models:
  - name: stg_records
    description: Source records joined to their normalised fields and cluster id.
    columns:
      - name: record_id
        description: Primary key from the originating system.
        tests: [unique, not_null]
      - name: source_system
        tests:
          - accepted_values:
              values: ["crm_export", "registry_extract"]
      - name: naics_status
        tests:
          - accepted_values:
              values: ["unchanged", "remapped", "ambiguous_split", "retired", "unknown"]
      - name: naics_candidates
        description: >
          Comma separated 2022 codes when naics_status is ambiguous_split,
          otherwise null. Present so a reviewer can pick, not so the model can.

  - name: stg_naics_crosswalk
    description: >
      One row per (2012 code, 2022 code) pair in the published concordance.
      A 2012 code with target_count > 1 was split and cannot be mapped from
      the record alone.
    columns:
      - name: mapping_key
        tests: [unique, not_null]
      - name: code_2012
        tests: [not_null]

  - name: stg_naics_2022
    description: One row per 2022 NAICS code, for joins on the current vintage.
    columns:
      - name: code_2022
        tests: [unique, not_null]
